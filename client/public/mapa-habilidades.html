<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de habilidades</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: el radar ocupa toda la pantalla y es lo único visible; la edición aparece sobre el gráfico solo al mantener apretado. */
:root{
  --bg:#ffffff; --panel:#f4f4f5; --ink:#0a0a0a; --muted:#5f5f66; --line:#d9d9de; --grid:#a3a3ab;
  --real:#f07a0c; --real2:#d93a1c; --real3:#b0145a; --zdp:#0a8f88; --locked:#8c8c94;
  --display:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#000000; --panel:#141414; --ink:#f5f5f5; --muted:#a1a1aa; --line:#2e2e33; --grid:#5c5c64;
  --real:#ff8f1f; --real2:#ff4d2e; --real3:#ff3d8b; --zdp:#3fe0d0; --locked:#76767e; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#000000; --panel:#141414; --ink:#f5f5f5; --muted:#a1a1aa; --line:#2e2e33; --grid:#5c5c64;
  --real:#ff8f1f; --real2:#ff4d2e; --real3:#ff3d8b; --zdp:#3fe0d0; --locked:#76767e; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);overflow:hidden}
.wrap{height:100%;padding-inline:16px;padding-block:calc(66px + env(safe-area-inset-top, 0px)) 12px;display:flex;align-items:center;justify-content:center}
svg{display:block;width:100%;height:100%;max-width:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.ring{fill:none;stroke:var(--grid);stroke-width:1.6}
.ring.major{stroke:var(--muted);stroke-width:1.6}
.axis{stroke:var(--grid);stroke-width:1.6}
.poly-zdp{fill:var(--zdp);fill-opacity:.1;stroke:var(--zdp);stroke-width:2;stroke-dasharray:7 7;stroke-linejoin:round}
.poly-real{fill:var(--real);fill-opacity:.5;stroke:var(--real);stroke-width:3.5;stroke-linejoin:round}
.wedge{fill-opacity:.6;stroke-width:3;stroke-linejoin:round}
.t1{fill:var(--real);stroke:var(--real)} .t2{fill:var(--real2);stroke:var(--real2)} .t3{fill:var(--real3);stroke:var(--real3)}
.flash{animation:flash .8s ease-out}
@keyframes flash{0%{fill-opacity:.95;filter:drop-shadow(0 0 22px var(--real))}100%{filter:drop-shadow(0 0 0 transparent)}}

.lbl{font-weight:700;font-size:36px;fill:var(--ink);cursor:pointer;outline:none}
.lbl:focus-visible{text-decoration:underline}
.lbl-n{font-weight:500;font-size:24px;fill:var(--muted)}
.zlbl,.nlbl{font-weight:600;font-size:21px;stroke:var(--bg);stroke-width:5px;paint-order:stroke;stroke-linejoin:round;pointer-events:none}
.zlbl{fill:var(--zdp)} .nlbl{fill:var(--ink)}
.zlbl.tap,.nlbl.tap{pointer-events:auto;cursor:pointer} .zlbl.ulbl{fill:var(--real)}
@media (max-width:560px){ .lbl{font-size:46px} .lbl-n{font-size:30px} .zlbl,.nlbl{font-size:30px} }

.node{cursor:pointer;outline:none}
.node .hit{fill:transparent;stroke:none}
.node.done .dot{stroke:var(--bg);stroke-width:3}
.node.locked .dot{fill:var(--locked);stroke:none}
.node.act .dot{fill:var(--bg);stroke:var(--zdp);stroke-width:2}
.node.act.ok .dot{fill:var(--real);stroke:var(--bg)}
.node.locked.last .dot{fill:var(--ink);fill-opacity:.8}
.node.done.last .dot{stroke:var(--ink)}
.node.zdp .dot{fill:var(--bg);stroke:var(--zdp);stroke-width:4}
.node.zdp .halo{fill:none;stroke:var(--zdp);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:halo 1.8s ease-out infinite}
.node.zdp:hover .dot{fill:var(--zdp)}
.node:focus-visible .hit{stroke:var(--ink);stroke-width:2;stroke-dasharray:3 3}
.dia{fill:var(--bg);stroke:var(--real);stroke-width:2.5;stroke-linejoin:round}
.plus{font-weight:700;font-size:17px;fill:var(--real);pointer-events:none}
.node.up .dia{fill:var(--real)}
.node.up .plus{fill:var(--bg)}
.node.up:hover .dia{stroke:var(--ink)}
@keyframes halo{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.burst{fill:none;stroke:var(--real);stroke-width:4;transform-box:fill-box;transform-origin:center;animation:burst .8s ease-out forwards;pointer-events:none}
@keyframes burst{0%{transform:scale(.3);opacity:1}100%{transform:scale(5);opacity:0}}
@media (prefers-reduced-motion:reduce){ .node.zdp .halo,.burst,.flash{animation:none} .burst{opacity:0} }

.bar{position:fixed;left:0;right:0;top:0;z-index:4;display:flex;padding:calc(10px + env(safe-area-inset-top, 0px)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.bar,.wrap,.back{transition:transform .25s ease,padding .25s ease,top .25s ease}
.barc .bar{transform:translateY(-100%)}
.barc .wrap{padding-top:calc(12px + env(safe-area-inset-top, 0px))}
.barc .back{top:calc(10px + env(safe-area-inset-top, 0px))}
.bar-tog{position:fixed;top:calc(12px + env(safe-area-inset-top, 0px));right:12px;z-index:5;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;padding:0}
.bar-tog:hover{color:var(--ink);border-color:var(--muted)}
.bar-tog:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.bar-tog svg{width:16px;height:16px;transition:transform .25s ease}
.barc .bar-tog svg{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){ .bar,.wrap,.back,.bar-tog svg{transition:none} }
.chips{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-right:48px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:600 .9rem var(--display);padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);white-space:nowrap;cursor:pointer}
.chip:hover{color:var(--ink);border-color:var(--muted)}
.chip.on{background:var(--real);border-color:var(--real);color:var(--bg)}
.chip.cur{border-color:var(--real);color:var(--real)}
.chip.head{border-color:var(--real);color:var(--real);background:transparent}
.chip{animation:chipIn .25s ease-out both}
@keyframes chipIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .chip{animation:none} }
.chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wiz{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.wiz-box{width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.wiz-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 20px 10px}
.wiz-step{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--zdp);font-variant-numeric:tabular-nums}
.wiz h2{margin:4px 0 0;font-size:1.3rem;line-height:1.2;text-wrap:balance}
.wiz-dots{display:flex;gap:6px;padding:0 20px 14px}
.wiz-dots i{height:4px;flex:1;border-radius:2px;background:var(--line);transition:background .3s}
.wiz-dots i.on{background:var(--real)}
.wiz-view{overflow:hidden;flex:1;min-height:0}
.wiz-track{display:flex;align-items:flex-start;transition:transform .38s cubic-bezier(.2,.8,.2,1)}
.wiz-track.instant{transition:none}
.wiz-pane{flex:0 0 100%;min-width:0;overflow-y:auto;max-height:min(60vh,520px);padding:2px 20px 16px}
.wiz-pane p{color:var(--muted);margin:0 0 14px;font-size:.95rem;line-height:1.45;max-width:60ch}
.wiz-pane p b{color:var(--ink)}
.wrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.wrow .num{flex:none;width:20px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem}
.wiz input[type=text]{flex:1;min-width:0;width:100%;font:600 15px var(--display);padding:9px 11px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px}
.wiz input[type=text]:focus-visible{outline:2px solid var(--zdp);outline-offset:1px}
.wiz label.ok{flex:none;display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.85rem;cursor:pointer}
.wiz input[type=checkbox]{width:18px;height:18px;accent-color:var(--real);cursor:pointer}
.wiz-sec{margin-bottom:18px}
.wiz-sec h3{font-size:1rem;margin:0 0 2px}
.wiz-sec .next{color:var(--zdp);font-size:.85rem;margin-bottom:8px}
.wiz-sum{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.wiz-sum li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.wiz-sum span{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.wiz-foot{display:flex;align-items:center;gap:10px;padding:12px 20px 16px;border-top:1px solid var(--line)}
.wiz-err{flex:1;margin:0;color:var(--real2);font-size:.85rem}
.wiz button{font:600 .9rem var(--display);border-radius:6px;padding:9px 16px;cursor:pointer;border:2px solid var(--zdp);background:var(--zdp);color:var(--bg)}
.wiz button.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.wiz button.ghost:hover{color:var(--ink);border-color:var(--muted)}
.wiz button.mini{padding:4px 10px;flex:none}
.wiz button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wiz .wiz-x{background:transparent;border:none;color:var(--muted);font-size:1.6rem;line-height:1;padding:0 4px}
@media (prefers-reduced-motion:reduce){ .wiz-track{transition:none} }
.wiz textarea{width:100%;font:400 14px var(--display);padding:8px 11px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;resize:vertical;min-height:52px}
.wiz textarea:focus-visible{outline:2px solid var(--zdp);outline-offset:1px}
.nrow{display:flex;gap:8px;align-items:flex-start;margin-bottom:14px}
.nrow .num{flex:none;width:20px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem;padding-top:11px}
.nrow .ncol{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.menu{position:fixed;z-index:6;min-width:220px;max-width:calc(100% - 16px);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;box-shadow:0 12px 30px rgba(0,0,0,.35);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.menu-cap{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 10px 6px}
.mitem{display:block;width:100%;text-align:left;font:600 .95rem var(--display);padding:10px;border-radius:6px;border:none;background:transparent;color:var(--ink);cursor:pointer}
.mitem:hover{background:var(--bg)}
.mitem.on{color:var(--real)}
.mitem:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.menu-hint{margin:6px 10px 4px;font-size:.78rem;color:var(--muted)}
.back{position:fixed;left:12px;top:calc(70px + env(safe-area-inset-top, 0px));display:flex;align-items:center;gap:10px;z-index:4;font-weight:600;color:var(--zdp)}
.back button{font:600 .95rem var(--display);padding:8px 12px;border-radius:6px;cursor:pointer;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.back button:hover{border-color:var(--zdp);color:var(--zdp)}
.back button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.gdot{fill:var(--locked)} .gdot.on{fill:var(--real)}
.node.enter:hover .dia{fill:var(--real)} .node.enter:hover .plus{fill:var(--bg)}
.zoom{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:6px;z-index:4}
.zoom button{width:40px;height:40px;font:700 20px var(--display);line-height:1;border-radius:6px;cursor:pointer;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.zoom button:hover{border-color:var(--zdp);color:var(--zdp)}
.zoom button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.zoom button:disabled{opacity:.35;cursor:default}
.pop{position:fixed;width:260px;max-width:calc(100% - 16px);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:5}
.pop label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pop input,.pop select{width:100%;font:600 16px var(--display);padding:8px 10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px}
.pop textarea{width:100%;font:400 15px var(--display);padding:8px 10px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:4px;resize:vertical;min-height:64px}
.pop .desc-view{margin:0;font-size:.92rem;line-height:1.4;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;max-height:40vh;overflow:auto}
.pop .desc-view.empty{color:var(--muted);font-style:italic}
.pop .btns{display:flex;flex-wrap:wrap;gap:8px}
.pop button{font:600 .85rem var(--display);border-radius:4px;padding:7px 12px;cursor:pointer;border:2px solid var(--zdp);background:var(--zdp);color:var(--bg)}
.pop button.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
.pop button.danger{background:transparent;color:var(--real2);border-color:var(--real2)}
.pop input:focus-visible,.pop select:focus-visible,.pop textarea:focus-visible,.pop button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="bar" id="bar"><div class="chips" id="chips" role="tablist" aria-label="Mapas de habilidades"></div></div>
<button type="button" class="bar-tog" id="barTog" aria-controls="bar" aria-expanded="true" aria-label="Ocultar áreas y habilidades" title="Ocultar áreas y habilidades"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
<div class="wrap">
  <svg id="svg" viewBox="-430 -335 860 670" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Gráfico radial de habilidades">
    <g id="gGrid"></g>
    <polygon id="pZdp" class="poly-zdp" points=""></polygon>
    <polygon id="pReal" class="poly-real" points=""></polygon>
    <g id="gWedge"></g>
    <g id="gFx"></g>
    <g id="gNodes"></g>
    <g id="gLabels"></g>
  </svg>
</div>
<div class="back" id="back" hidden><button type="button" id="backBtn">←</button><span id="crumb"></span></div>
<div class="zoom">
  <button type="button" id="zIn" aria-label="Acercar" title="Acercar">+</button>
  <button type="button" id="zOut" aria-label="Alejar" title="Alejar">−</button>
  <button type="button" id="zFit" aria-label="Ver todo el gráfico" title="Ver todo">⤢</button>
</div>
<div class="wiz" id="wiz" hidden role="dialog" aria-modal="true" aria-labelledby="wizTitle">
  <div class="wiz-box">
    <div class="wiz-head">
      <div><div class="wiz-step" id="wizStep">Paso 1</div><h2 id="wizTitle">Nueva habilidad</h2></div>
      <button type="button" class="wiz-x" id="wizX" aria-label="Cancelar">×</button>
    </div>
    <div class="wiz-dots" id="wizDots"></div>
    <div class="wiz-view"><div class="wiz-track" id="wizTrack"></div></div>
    <div class="wiz-foot">
      <button type="button" class="ghost" id="wizBack">Atrás</button>
      <p class="wiz-err" id="wizErr" role="alert"></p>
      <button type="button" id="wizNext">Siguiente</button>
    </div>
  </div>
</div>
<div class="wiz" id="nxt" hidden role="dialog" aria-modal="true" aria-labelledby="nxtTitle">
  <div class="wiz-box">
    <div class="wiz-head">
      <div><div class="wiz-step" id="nxtStep"></div><h2 id="nxtTitle"></h2></div>
      <button type="button" class="wiz-x" id="nxtX" aria-label="Cancelar">×</button>
    </div>
    <div class="wiz-pane" id="nxtBody"></div>
    <div class="wiz-foot">
      <p class="wiz-err"></p>
      <button type="button" class="ghost" id="nxtCancel">Cancelar</button>
      <button type="button" id="nxtSave">Guardar</button>
    </div>
  </div>
</div>
<div class="menu" id="menu" hidden role="menu">
  <div class="menu-cap" id="menuCap"></div>
  <div id="menuList"></div>
  <p class="menu-hint">Mantené apretado el fondo de este menú para crear un mapa.</p>
</div>
<div class="pop" id="pop" hidden>
  <label for="popName" id="popCap">Habilidad</label>
  <input id="popName" type="text" maxlength="40" autocomplete="off">
  <select id="popSel" hidden aria-labelledby="popCap"></select>
  <textarea id="popDesc" rows="3" maxlength="400" placeholder="Descripción" aria-label="Descripción de la habilidad" hidden></textarea>
  <p id="popDescView" class="desc-view" hidden></p>
  <div class="btns">
    <button type="button" id="popSave">Guardar</button>
    <button type="button" class="ghost" id="popLock">Volver a bloquear</button>
    <button type="button" class="ghost" id="popAdd">Agregar eje</button>
    <button type="button" class="ghost" id="popSub">Dividir en subskills</button>
    <button type="button" class="ghost" id="popNext" hidden>Preparar próximo nivel</button>
    <button type="button" class="danger" id="popDel">Eliminar eje</button>
    <button type="button" class="ghost" id="popClose">Cerrar</button>
  </div>
</div>

<script>
(function(){
  var NS='http://www.w3.org/2000/svg', R=200, R0=30, SP=90, KEY='mapa-habilidades-v8', OLD7='mapa-habilidades-v7', OLD='mapa-habilidades-v6', PER=5;
  /* Áreas del skill tree que manda la app en el hash (#areas=[...]&theme=dark). Sin ellas, las áreas se escriben a mano. */
  var HOST=(function(){
    try{ var q=new URLSearchParams(location.hash.slice(1)), th=q.get('theme');
      if(th==='dark'||th==='light') document.documentElement.setAttribute('data-theme',th);
      var a=JSON.parse(q.get('areas')||'null');
      return Array.isArray(a)?a.filter(function(s){return typeof s==='string'&&s.trim()}):null;
    }catch(e){ return null }
  })();
  function ejemplo(){ return {name:'Intelectual',children:[
    {name:'Leer',children:[
      {name:'Análisis crítico de lectura',level:3,tier:0,tiers:[['Identifica la tesis de un texto','Distingue hecho de opinión','Resume el argumento central','Detecta supuestos implícitos','Compara dos textos del mismo tema']]},
      {name:'Lectura fluida',level:0,tier:0,tiers:[['Lee 20 minutos sin distraerse','Lee 20 páginas por día','Lee en voz alta sin trabarse','Termina un libro por mes','Lee 40 páginas por hora']]},
      {name:'Amplitud de vocabulario',level:1,tier:0,tiers:[['Anota palabras nuevas al leer','Busca cada palabra desconocida','Usa 5 palabras nuevas por semana','Deduce significado por contexto','Reconoce raíces griegas y latinas']]}
    ]},
    {name:'Escribir',level:2,tier:0,tiers:[['Escribe un párrafo claro','Arma un esquema previo','Redacta un resumen','Escribe un ensayo corto','Revisa y reescribe un texto']]},
    {name:'Estudiar',level:1,tier:0,tiers:[['Subraya ideas principales','Arma fichas de estudio','Hace mapas conceptuales','Repasa de forma espaciada','Explica el tema en voz alta']]}
  ]} }

  var base={w:0,h:0}, view={cx:0,cy:0,s:1}, ptrs={}, pinchD=0, dragged=false;
  var data=null, cur=null, maps=[], sel=0, zones=[], sa=0, menuA=null, barA=null;
  var areas=[], V=null, raf=0, shown=null, edit=null, longFired=false;
  var $=function(id){return document.getElementById(id)}, svg=$('svg');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Dentro de la app los datos viven en el servidor (por usuario) para que se vean igual en todos los
     dispositivos; localStorage queda como copia local y para cuando no hay conexión. */
  var API=HOST?'/api/radar-maps':null, ready=false, sending=false, queued=null;
  function setDirty(v){ try{ if(v) localStorage.setItem(KEY+'-dirty','1'); else localStorage.removeItem(KEY+'-dirty') }catch(e){} }
  function push(s){
    if(!API) return; if(sending){ queued=s; return } sending=true;
    var body='{"data":'+s+'}';
    fetch(API,{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'same-origin',keepalive:body.length<60000,body:body})
      .then(function(r){ setDirty(!r.ok) },function(){ setDirty(true) })
      .then(function(){ sending=false; if(queued!=null){ var q=queued; queued=null; push(q) } });
  }
  function save(){
    if(!ready) return;

      W.final.forEach(function(f,i){
        if(f.done>=PER) return;
        var sec=h('div',{class:'wiz-sec'},[h('h3',{text:f.name}),h('div',{class:'next',text:'Próximo: '+(f.hechos[f.done].trim()||'Subskill '+(f.done+1))})]);
        f.acts.forEach(function(av,k){ sec.appendChild(h('div',{class:'wrow'},[h('span',{class:'num',text:k+1}),txt('wA'+i+'-'+k,av,'Actividad '+(k+1),function(v){f.acts[k]=v})])) });
        p.appendChild(sec);
      });
      if(W.final.every(function(f){return f.done>=PER})) p.appendChild(h('p',{text:'Todas las skills tienen su nivel 1 completo, así que no hay actividades para cargar.'}));
    } else if(st==='end'){
      p.appendChild(h('p',{html:'Todo listo para crear <b>'+escH(W.name.trim())+'</b>. Después podés renombrar cualquier cosa manteniéndola apretada.'}));
      var ul=h('ul',{class:'wiz-sum'});
      W.final.forEach(function(f){ var na=f.acts.filter(function(x){return x.trim()}).length;
        ul.appendChild(h('li',{},[h('b',{text:f.name}),h('span',{text:f.done+' / 5 subskills'+(na?' · '+na+(na>1?' actividades':' actividad'):'')})])) });
      p.appendChild(ul);
    }
    return p;
  }
  function buildWiz(){
    var tr=$('wizTrack'); tr.textContent=''; steps.forEach(function(st){ tr.appendChild(pane(st)) });
    tr.classList.add('instant'); tr.style.transform='translateX('+(-ws*100)+'%)'; void tr.offsetWidth; tr.classList.remove('instant');
    syncWiz();
  }
  function syncWiz(){
    var n=steps.length<3?5:steps.length;
    $('wizStep').textContent='Paso '+(ws+1)+' de '+n;
    var titles={name:'Nueva habilidad',skills:'Skills del mapa',acts:'Actividades',end:'Revisá y creá'};
    var st=steps[ws]; $('wizTitle').textContent=titles[st]||W.final[+st.slice(1)].name;
    var d=$('wizDots'); d.textContent=''; for(var k=0;k<n;k++) d.appendChild(h('i',{class:k<=ws?'on':''}));
    $('wizBack').hidden=ws===0; $('wizNext').textContent=st==='end'?'Crear mapa':'Siguiente'; $('wizErr').textContent='';
    Array.prototype.forEach.call($('wizTrack').children,function(pn,k){ if(k===ws) pn.removeAttribute('inert'); else pn.setAttribute('inert','') });
  }
  function goWiz(s){
    ws=s; if(steps[s]==='acts'||steps[s]==='end'){ var tr=$('wizTrack'), keep=ws; ws=Math.max(0,s-1); buildWiz(); ws=keep }
    $('wizTrack').style.transform='translateX('+(-ws*100)+'%)'; syncWiz();
    setTimeout(function(){ var pn=$('wizTrack').children[ws], el=pn&&pn.querySelector('input[type=text]'); if(el) el.focus({preventScroll:true}); else $('wizNext').focus() },reduce?0:380);
  }
  function wizNext(){
    var st=steps[ws];
    if(st==='name'&&!W.name.trim()){ $('wizErr').textContent='Escribí qué habilidad querés mapear.'; return }
    if(st==='skills'){
      var names=W.skills.map(function(x){return x.trim()}).filter(Boolean);
      if(names.length<4){ $('wizErr').textContent='Hacen falta al menos 4 skills con nombre.'; return }
      var prev=W.final||[];
      W.final=names.map(function(nm){ var o=prev.filter(function(f){return f.name===nm})[0]; return o||{name:nm,hechos:['','','','',''],done:0,acts:['','','']} });
      steps=['name','skills'].concat(W.final.map(function(f,i){return 'h'+i}),['acts','end']); buildWiz();
    }
    if(st==='end'){ createFromWizard(); return }
    goWiz(ws+1);
  }
  function createFromWizard(){
    var root={name:W.name.trim(),children:W.final.map(function(f){
      var leaf={name:f.name,level:f.done,tier:0,tiers:[f.hechos.map(function(x,k){return x.trim()||'Subskill '+(k+1)})]};
      (f.descs||[]).forEach(function(d,k){ if(d.trim()) setDesc(leaf,k,d.trim()) });
      var ac=f.acts.map(function(x){return x.trim()}).filter(Boolean);
      if(ac.length&&f.done<PER){ leaf.acts={}; leaf.acts[f.done]=ac.map(function(n){return {n:n,d:false}}) }
      return leaf })};
    var za=W.area; zones[za].maps.push(root); closeWizard(true); barA=za; pick(za,zones[za].maps.length-1); flash($('pReal'));
  }
  $('wizNext').addEventListener('click',wizNext);
  $('wizBack').addEventListener('click',function(){ if(ws>0) goWiz(ws-1) });
  $('wizX').addEventListener('click',function(){ closeWizard() });
  $('wiz').addEventListener('keydown',function(ev){
    if(ev.key==='Escape') closeWizard(false);
    else if(ev.key==='Enter'&&ev.target.type==='text'){ ev.preventDefault(); wizNext() }
  });
  holdOn(svg,function(ev){ return !(ev.target.closest&&ev.target.closest('.node,.lbl,.rombo')) },function(x,y){ openBg(x,y) });

  /* Barra plegable: al ocultarla, el radar usa el alto que ocupaba. */
  function setBar(open){
    var b=document.body, t=$('barTog'), lbl=open?'Ocultar áreas y habilidades':'Mostrar áreas y habilidades';
    b.classList.toggle('barc',!open); $('bar').setAttribute('aria-hidden',open?'false':'true');
    if(open) $('bar').removeAttribute('inert'); else $('bar').setAttribute('inert','');
    t.setAttribute('aria-expanded',open?'true':'false'); t.setAttribute('aria-label',lbl); t.title=lbl;
    save();
  }
  $('barTog').addEventListener('click',function(){ closeEdit(); closeMenu(); setBar(document.body.classList.contains('barc')) });

  function boot(d){
    loadAll(d); setBar(!(d&&d.bar===false)); ready=true;
    barA=sa; data=maps[sel]; renderBar(); go(null);
  }
  var local=readLocal(), dirty=false; try{ dirty=localStorage.getItem(KEY+'-dirty')==='1' }catch(e){}
  if(!API) boot(local);
  else fetch(API,{credentials:'same-origin',cache:'no-store'})
    .then(function(r){ if(!r.ok) throw r; return r.json() })
    .then(function(j){
      var srv=j&&j.data;
      if(savedOK(srv)&&!(dirty&&savedOK(local))){
        /* Gana el servidor; si la copia local era distinta queda guardada como respaldo. */
        try{ var ls=JSON.stringify(local), ss=JSON.stringify(srv); if(savedOK(local)&&ls!==ss) localStorage.setItem(KEY+'-backup',ls); localStorage.setItem(KEY,ss) }catch(e){}
        boot(srv);
      } else {
        /* Primera vez en el servidor, o cambios locales que no se llegaron a subir: se suben ahora. */
        boot(local); if(savedOK(local)) save();
      }
    })
    .catch(function(){ boot(local) });
})();
</script>
